<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Property Manager — sites, plots, payments, and ledger">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Property Manager">
  <meta name="theme-color" content="#1E3A8A">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Property Manager</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1E3A8A;
      overflow: hidden;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #fff;
      font-family: Roboto, system-ui, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 20px;
    }
    #loading p { margin: 6px 0; opacity: 0.95; font-size: 15px; }
    #loading .hint { font-size: 12px; opacity: 0.75; max-width: 280px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading" aria-live="polite">
    <div class="spinner"></div>
    <p><strong>Property Manager</strong></p>
    <p class="hint">Loading… First open on mobile may take a minute.</p>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
    setTimeout(function () {
      var el = document.getElementById('loading');
      if (!el) return;
      var hint = el.querySelector('.hint');
      if (hint) {
        hint.textContent =
          'Still loading? Check your internet, then close and reopen. Or open in Chrome: propertymanagerapp-c4961.web.app';
      }
    }, 45000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
