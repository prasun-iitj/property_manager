name: property_manager
description: "A Flutter property & finance management app."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🔥 Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.4.10
  cloud_functions: ^5.2.1
  google_sign_in: ^6.2.1

  # 📂 File & Camera
  file_picker: ^11.0.2
  image_picker: ^1.0.7

  # 📥 Download
  dio: ^5.4.0
  path_provider: ^2.1.3

  # 📄 PDF Viewer
  syncfusion_flutter_pdfviewer: ^24.1.41

  # 📊 UI & Charts
  cupertino_icons: ^1.0.8
  fl_chart: ^0.66.2

  # 🔗 Utilities
  url_launcher: ^6.2.5
  intl: ^0.19.0

  # 📤 Sharing & Export
  share_plus: ^12.0.1

  # 🧾 PDF Creation
  pdf: ^3.11.0
  printing: ^5.13.0

  # 🔔 Notifications
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true